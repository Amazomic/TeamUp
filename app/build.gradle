plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.teampicker.app'
    compileSdk 36

    signingConfigs {
        release {
            def signingFile = rootProject.file('signing.properties')
            if (signingFile.exists()) {
                def signingProperties = new Properties()
                signingFile.withInputStream { signingProperties.load(it) }
                storeFile rootProject.file(signingProperties['storeFile'])
                storePassword signingProperties['storePassword']
                keyAlias signingProperties['keyAlias']
                keyPassword signingProperties['keyPassword']
            }
        }
    }

    defaultConfig {
        applicationId 'ru.teampicker.app'
        minSdk 23
        targetSdk 36
        versionCode 8
        versionName '1.3.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            if (rootProject.file('signing.properties').exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }
}

android.applicationVariants.all { variant ->
    variant.outputs.all { output ->
        outputFileName = "TeamUp-${variant.versionName}-Android.apk"
    }
}
